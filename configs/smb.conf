[global]
   workgroup = WORKGROUP
   server string = NAS Server
   security = user
   map to guest = Bad User
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d
   server role = standalone server
   obey pam restrictions = yes
   unix password sync = yes
   passwd program = /usr/bin/passwd %u
   passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
   pam password change = yes
   min protocol = SMB2
   ea support = yes
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[shared]
   comment = 公共共享
   path = /data/shared
   browseable = yes
   read only = no
   create mask = 0775
   directory mask = 0775
   valid users = __NAS_USER__
   force user = __NAS_USER__
   force group = __NAS_USER__

[media]
   comment = 影音文件
   path = /data/media
   browseable = yes
   read only = yes
   guest ok = no
   valid users = __NAS_USER__

[documents]
   comment = 文档资料
   path = /data/documents
   browseable = yes
   read only = no
   create mask = 0775
   directory mask = 0775
   valid users = __NAS_USER__

[photos]
   comment = 照片
   path = /data/photos
   browseable = yes
   read only = no
   create mask = 0775
   directory mask = 0775
   valid users = __NAS_USER__

[backups]
   comment = 备份
   path = /data/backups
   browseable = yes
   read only = no
   create mask = 0775
   directory mask = 0775
   valid users = __NAS_USER__

[__NAS_USER__]
   comment = __NAS_USER__ 私有目录
   path = /data/private/__NAS_USER__
   browseable = no
   read only = no
   create mask = 0700
   directory mask = 0700
   valid users = __NAS_USER__

