# ============================================================
# .github/workflows/ci.yml — GitHub Actions 镜像
#
# 与 .gitee-ci.yml 功能一致，用于 GitHub 镜像仓库自动构建。
# 如果在 GitHub 上也有镜像仓库，push 后自动运行。
# ============================================================

name: NAS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: web/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: web
          args: --timeout=5m

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: web/go.sum
      - name: 运行测试
        run: cd web && go test ./... -v -cover -coverprofile=coverage.out
      - name: 覆盖率报告
        run: cd web && go tool cover -func=coverage.out
      - name: 上传覆盖率
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: web/coverage.out

  build:
    name: 跨平台编译
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: 编译
        run: |
          cd web
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm || ' ' }} go build -trimpath -ldflags="-s -w" -o nas-panel .
      - uses: actions/upload-artifact@v4
        with:
          name: nas-panel-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && '-armv7' || '' }}
          path: web/nas-panel
